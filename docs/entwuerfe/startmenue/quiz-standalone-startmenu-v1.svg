<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1440" height="810" viewBox="0 0 1440 810"
     role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Bundestags-Quiz – Standalone Startmenü</title>
  <desc id="svg-description">Dunkles, touch-optimiertes Startmenü mit Quizmotiv links sowie Auswahl von Spielmodus und Schwierigkeit rechts.</desc>

  <metadata id="asset-manifest"><![CDATA[
  {
    "document": "quiz-standalone-startmenu-v1",
    "version": 1,
    "canvas": { "width": 1440, "height": 810 },
    "exportableGroups": [
      "asset--background",
      "asset--language-switcher",
      "asset--settings-button",
      "asset--brand-panel",
      "asset--mode-selector",
      "asset--difficulty-selector",
      "asset--start-button"
    ],
    "notes": "Every exportable group has data-export-name and data-export-viewbox. Text stays editable. No raster content is embedded. Keep defs and style when extracting a group."
  }
  ]]></metadata>

  <defs>
    <!-- Design tokens -->
    <style><![CDATA[
      .display {
        font-family: "Melior", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      }
      .ui {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .eyebrow {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2.2px;
        fill: #42D176;
      }
      .section-label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.3px;
        fill: #98A7B7;
      }
      .button-title {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 650;
        fill: #F5F7F9;
      }
      .button-meta {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #98A7B7;
      }
      .selected-outline { stroke: #42D176; stroke-width: 2; }
      .inactive-outline { stroke: #2B3948; stroke-width: 1; }
    ]]></style>

    <linearGradient id="gradient--background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111B25"/>
      <stop offset="0.55" stop-color="#0A1118"/>
      <stop offset="1" stop-color="#070C11"/>
    </linearGradient>
    <radialGradient id="gradient--ambient-left" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2BBE65" stop-opacity="0.16"/>
      <stop offset="0.58" stop-color="#2BBE65" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2BBE65" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradient--ambient-right" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#726BEA" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#726BEA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradient--brand-card" x1="0.08" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1D2B27"/>
      <stop offset="0.48" stop-color="#173828"/>
      <stop offset="1" stop-color="#205D34"/>
    </linearGradient>
    <linearGradient id="gradient--brand-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9E93E"/>
      <stop offset="0.52" stop-color="#54DF7F"/>
      <stop offset="1" stop-color="#2ABB65"/>
    </linearGradient>
    <linearGradient id="gradient--start" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46D77A"/>
      <stop offset="1" stop-color="#28B962"/>
    </linearGradient>
    <linearGradient id="gradient--glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow--green" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Reusable vector assets -->
    <symbol id="icon--sliders" viewBox="0 0 24 24">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="8" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="icon--person" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5.5 20c.6-4.1 2.8-6.2 6.5-6.2s5.9 2.1 6.5 6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon--people" viewBox="0 0 24 24">
      <circle cx="8.3" cy="8.2" r="2.7" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="16.2" cy="8.2" r="2.7" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M3.3 19c.4-3.5 2-5.3 5-5.3 1.6 0 2.8.5 3.6 1.4M12.1 15.1c.8-.9 2.1-1.4 3.8-1.4 2.9 0 4.5 1.8 4.9 5.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon--check" viewBox="0 0 24 24">
      <path d="M6.3 12.4l3.5 3.5 7.9-8.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon--arrow" viewBox="0 0 24 24">
      <path d="M5 12h13M13.5 6.5L19 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon--spark" viewBox="0 0 24 24">
      <path d="M12 2.8c.6 4.6 2.6 6.6 7.2 7.2-4.6.6-6.6 2.6-7.2 7.2-.6-4.6-2.6-6.6-7.2-7.2 4.6-.6 6.6-2.6 7.2-7.2Z" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- EXPORT: Full background -->
  <g id="asset--background" data-export-name="background" data-export-viewbox="0 0 1440 810">
    <rect width="1440" height="810" fill="url(#gradient--background)"/>
    <ellipse cx="302" cy="401" rx="426" ry="406" fill="url(#gradient--ambient-left)"/>
    <ellipse cx="1230" cy="280" rx="390" ry="360" fill="url(#gradient--ambient-right)"/>
    <path d="M0 744C285 699 548 745 832 711c213-26 385-93 608-58v157H0Z" fill="#FFFFFF" opacity="0.012"/>
  </g>

  <!-- EXPORT: Language switcher -->
  <g id="asset--language-switcher" data-export-name="language-switcher" data-export-viewbox="48 36 198 46">
    <rect x="48" y="36" width="198" height="46" rx="13" fill="#111A24" stroke="#263442"/>
    <rect x="52" y="40" width="95" height="38" rx="10" fill="#22302E" stroke="#42D176" stroke-width="1.5"/>
    <text x="99.5" y="64.5" text-anchor="middle" class="ui" font-size="14" font-weight="650" fill="#F5F7F9">Deutsch</text>
    <text x="196.5" y="64.5" text-anchor="middle" class="ui" font-size="14" font-weight="550" fill="#A5B2C0">English</text>
  </g>

  <!-- EXPORT: Settings button -->
  <g id="asset--settings-button" data-export-name="settings-button" data-export-viewbox="1340 34 50 50">
    <circle cx="1365" cy="59" r="24" fill="#17212D" stroke="#2B3948"/>
    <g color="#AAB6C3"><use xlink:href="#icon--sliders" x="1353" y="47" width="24" height="24"/></g>
  </g>

  <!-- EXPORT: Brand and quiz identity panel -->
  <g id="asset--brand-panel" data-export-name="brand-panel" data-export-viewbox="95 128 535 568">
    <rect x="106" y="145" width="513" height="558" rx="30" fill="#000000" opacity="0.24"/>
    <rect x="95" y="128" width="535" height="568" rx="32" fill="url(#gradient--brand-card)" stroke="#34483E"/>
    <rect x="96" y="129" width="533" height="566" rx="31" fill="url(#gradient--glass)"/>

    <text x="139" y="181" class="eyebrow">ABENDQUIZ</text>
    <circle cx="573" cy="167" r="19" fill="#E1EE4A" fill-opacity="0.12"/>
    <g color="#D9E93E"><use xlink:href="#icon--spark" x="563" y="157" width="20" height="20"/></g>

    <!-- Central orbital quiz mark -->
    <g id="asset--quiz-mark" data-export-name="quiz-mark" data-export-viewbox="185 202 356 284">
      <ellipse cx="363" cy="342" rx="153" ry="109" fill="#07100D" opacity="0.33"/>
      <ellipse cx="363" cy="342" rx="146" ry="103" fill="none" stroke="#D9E93E" stroke-opacity="0.28"/>
      <ellipse cx="363" cy="342" rx="119" ry="140" fill="none" stroke="#53D67A" stroke-opacity="0.25" transform="rotate(55 363 342)"/>
      <path d="M233 375c35-89 116-139 233-122" fill="none" stroke="url(#gradient--brand-glow)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <path d="M486 308c-29 93-110 144-228 130" fill="none" stroke="#42D176" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
      <circle cx="363" cy="342" r="79" fill="#11231A" stroke="#67DB82" stroke-width="2"/>
      <circle cx="363" cy="342" r="66" fill="#0E1814" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <text x="363" y="370" text-anchor="middle" class="display" font-size="82" font-weight="700" fill="#D9E93E">?</text>
      <circle cx="231" cy="376" r="8" fill="#D9E93E" filter="url(#glow--green)"/>
      <circle cx="468" cy="254" r="6" fill="#42D176"/>
      <circle cx="486" cy="404" r="5" fill="#8D86FF"/>
      <circle cx="292" cy="226" r="4" fill="#FFFFFF" opacity="0.72"/>
    </g>

    <text x="139" y="552" class="display" font-size="43" font-weight="650" fill="#F5F7F9">Bundestags-Quiz</text>
    <text x="139" y="588" class="ui" font-size="16" fill="#BED0C7">Teste dein Wissen über Demokratie,</text>
    <text x="139" y="612" class="ui" font-size="16" fill="#BED0C7">Politik und den Deutschen Bundestag.</text>
    <g transform="translate(139 644)">
      <rect width="166" height="31" rx="15.5" fill="#07100D" opacity="0.42"/>
      <circle cx="17" cy="15.5" r="4.5" fill="#42D176"/>
      <text x="31" y="20.5" class="ui" font-size="12" font-weight="600" fill="#D8E5DF">7 Fragen · ca. 5 Min.</text>
    </g>
  </g>

  <!-- Right setup panel -->
  <g id="layer--setup-panel">
    <text x="700" y="164" class="display" font-size="34" font-weight="650" fill="#F5F7F9">Spiel starten</text>
    <text x="700" y="195" class="ui" font-size="15" fill="#98A7B7">Wähle Modus und Schwierigkeit.</text>

    <!-- EXPORT: Mode selector -->
    <g id="asset--mode-selector" data-export-name="mode-selector" data-export-viewbox="700 236 646 132">
      <text x="700" y="246" class="section-label">01 · WIE VIELE SPIELEN?</text>

      <g id="mode--single" data-export-name="mode-single-selected" data-export-viewbox="700 265 311 92" data-state="selected" transform="translate(700 265)">
        <rect width="311" height="92" rx="16" fill="#1A2B29" class="selected-outline"/>
        <circle cx="47" cy="46" r="24" fill="#42D176" fill-opacity="0.12"/>
        <g color="#63DF8E"><use xlink:href="#icon--person" x="35" y="34" width="24" height="24"/></g>
        <text x="85" y="42" class="button-title">Allein</text>
        <text x="85" y="64" class="button-meta">Eine Person</text>
        <circle cx="281" cy="46" r="13" fill="#42D176"/>
        <g color="#07120C"><use xlink:href="#icon--check" x="273" y="38" width="16" height="16"/></g>
      </g>

      <g id="mode--versus" data-export-name="mode-versus-default" data-export-viewbox="1035 265 311 92" data-state="default" transform="translate(1035 265)">
        <rect width="311" height="92" rx="16" fill="#17212D" class="inactive-outline"/>
        <circle cx="47" cy="46" r="24" fill="#FFFFFF" fill-opacity="0.045"/>
        <g color="#A9B6C4"><use xlink:href="#icon--people" x="35" y="34" width="24" height="24"/></g>
        <text x="85" y="42" class="button-title">Zu zweit</text>
        <text x="85" y="64" class="button-meta">Buzzer-Duell</text>
      </g>
    </g>

    <!-- EXPORT: Difficulty selector -->
    <g id="asset--difficulty-selector" data-export-name="difficulty-selector" data-export-viewbox="700 400 646 151">
      <text x="700" y="410" class="section-label">02 · WIE SCHWER?</text>

      <g id="difficulty--easy" data-export-name="difficulty-easy-selected" data-export-viewbox="700 429 201 110" data-state="selected" transform="translate(700 429)">
        <rect width="201" height="110" rx="16" fill="#1A2B29" class="selected-outline"/>
        <circle cx="24" cy="24" r="7" fill="#42D176"/>
        <text x="24" y="64" class="display" font-size="22" font-weight="650" fill="#F5F7F9">Leicht</text>
        <text x="24" y="88" class="button-meta">7 Fragen</text>
        <circle cx="175" cy="24" r="11" fill="#42D176"/>
        <g color="#07120C"><use xlink:href="#icon--check" x="168" y="17" width="14" height="14"/></g>
      </g>

      <g id="difficulty--medium" data-export-name="difficulty-medium-default" data-export-viewbox="922 429 202 110" data-state="default" transform="translate(922 429)">
        <rect width="202" height="110" rx="16" fill="#17212D" class="inactive-outline"/>
        <circle cx="24" cy="24" r="7" fill="#D9E93E" opacity="0.68"/>
        <circle cx="42" cy="24" r="7" fill="#D9E93E" opacity="0.68"/>
        <text x="24" y="64" class="display" font-size="22" font-weight="650" fill="#F5F7F9">Mittel</text>
        <text x="24" y="88" class="button-meta">7 Fragen</text>
      </g>

      <g id="difficulty--hard" data-export-name="difficulty-hard-default" data-export-viewbox="1145 429 201 110" data-state="default" transform="translate(1145 429)">
        <rect width="201" height="110" rx="16" fill="#17212D" class="inactive-outline"/>
        <circle cx="24" cy="24" r="7" fill="#8D86FF" opacity="0.78"/>
        <circle cx="42" cy="24" r="7" fill="#8D86FF" opacity="0.78"/>
        <circle cx="60" cy="24" r="7" fill="#8D86FF" opacity="0.78"/>
        <text x="24" y="64" class="display" font-size="22" font-weight="650" fill="#F5F7F9">Schwer</text>
        <text x="24" y="88" class="button-meta">7 Fragen</text>
      </g>
    </g>

    <!-- EXPORT: Primary start action -->
    <g id="asset--start-button" data-export-name="start-button" data-export-viewbox="700 590 646 76">
      <rect x="708" y="601" width="630" height="72" rx="17" fill="#000000" opacity="0.22"/>
      <rect x="700" y="590" width="646" height="76" rx="17" fill="url(#gradient--start)"/>
      <rect x="701" y="591" width="644" height="74" rx="16" fill="none" stroke="#9CF0B8" stroke-opacity="0.42"/>
      <text x="744" y="635" class="ui" font-size="19" font-weight="750" fill="#06140C">Quiz starten</text>
      <circle cx="1305" cy="628" r="21" fill="#07120C" fill-opacity="0.15"/>
      <g color="#06140C"><use xlink:href="#icon--arrow" x="1293" y="616" width="24" height="24"/></g>
    </g>

    <text x="1023" y="701" text-anchor="middle" class="ui" font-size="12" fill="#6F7F8E">Auswahl kann jederzeit im Menü geändert werden</text>
  </g>
</svg>
