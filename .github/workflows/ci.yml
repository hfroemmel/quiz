# Regression net of the libraries.
#
# Two jobs, deliberately separated:
#
#   checks  typecheck, unit tests, package verification - fast, on the runner.
#   e2e     Playwright against the test bench - in the official Playwright
#           container, so that the screenshot baselines are compared on a
#           reproducible renderer instead of the one the runner happens to
#           bring along.
#
# The container version MUST match the @playwright/test version in the
# lockfile, otherwise browser and reference images drift apart.
#
# AND THE REFERENCE IMAGES BELONG IN THIS CONTAINER TOO. A baseline recorded
# anywhere else - a development container with a Chromium of its own, a laptop -
# compares two builds of the same browser against each other, and the diff that
# comes out is the build, not a regression. That is why the refresh runs HERE:
# start the workflow by hand with `update_snapshots`, and the run puts the new
# images on the branch it was started from. It is the only write this workflow
# makes, it happens only on that manual start, and it touches nothing outside
# `test/e2e` - the artifact carries the same images, for a look before trusting
# them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Re-record the screenshot baselines in the container'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The quiz package is not versioned - it is built from the test set
      # under content/source. Tests and test bench load from there only.
      - run: pnpm content:build
      - run: pnpm test
      # Build the package dists and check them as packed tarballs
      # (publint + attw) - the way the packages arrive when published later.
      - run: pnpm packages:build
      - run: pnpm packages:verify
      # The palette is GENERATED; its guard only checks that the stored
      # version matches the source. Here the generator itself runs.
      - run: pnpm palette:build
      - run: pnpm content:validate

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # For the baseline refresh below. Every other run of this job only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - run: pnpm test:e2e ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          # The container brings its own browsers; no CHROMIUM_PATH.
          HOME: /root
      - name: Keep test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            test/e2e/**/*-actual.png
          retention-days: 7
      # The re-recorded baselines go straight onto the branch - see the note at
      # the top. A picture that has to travel through a zip file and a pair of
      # hands before it reaches the repository is a picture nobody refreshes.
      #
      # `always()`, because the run that records them is the run whose
      # comparison failed; `git add -- test/e2e` alone, so a refresh can carry
      # nothing else along.
      - name: Put the new baselines on the branch
        if: ${{ always() && inputs.update_snapshots }}
        env:
          REFRESH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/e2e
          if git diff --cached --quiet; then
            echo 'The baselines already match this container - nothing to commit.'
            exit 0
          fi
          git diff --cached --name-only
          git commit -m 'Re-record the screenshot baselines in the container'
          git push "https://x-access-token:$REFRESH_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:$GITHUB_REF_NAME"
      # And the same images as an artifact, to look at before trusting them.
      - name: Hand out the new baselines
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: test/e2e/**/*-snapshots/**
          retention-days: 7
