# Publication of the @hfroemmel packages to GitHub Packages.
#
# Flow (changesets, fixed versioning across all five packages):
#   1. A push to main with open changesets creates or updates the version
#      pull request ("Version Packages").
#   2. Merging that pull request publishes the packages with the GITHUB_TOKEN.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@hfroemmel'

      - run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm packages:build

      - name: Maintain the version pull request or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: 'Version Packages'
          commit: 'Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
