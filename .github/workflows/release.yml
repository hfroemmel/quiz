# Veroeffentlichung der @hfroemmel-Pakete nach GitHub Packages.
#
# Ablauf (Changesets, fixed-Versioning ueber alle fuenf Pakete):
#   1. Ein Push auf main mit offenen Changesets erzeugt/aktualisiert den
#      Versions-PR ("Version Packages").
#   2. Das Mergen dieses PRs veroeffentlicht die Pakete mit dem GITHUB_TOKEN.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@hfroemmel'

      - run: pnpm install --frozen-lockfile

      - name: Pakete bauen
        run: pnpm packages:build

      - name: Versions-PR pflegen oder veroeffentlichen
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: 'Version Packages'
          commit: 'Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
